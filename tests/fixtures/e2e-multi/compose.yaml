services:
  web:
    build:
      context: ./web
    environment:
      PORT: ${WEB_PORT:-8000}
    ports:
      - "8080:8000"
    volumes:
      - type: bind
        source: ./config
        target: /app/config
        read_only: true
      - type: bind
        source: ./data
        target: /app/data
  worker:
    build:
      context: ./worker
    environment:
      PORT: ${WORKER_PORT:-9000}
    ports:
      - "9090:9000"
  redis:
    image: redis:7
  helper:
    image: busybox:1.36
